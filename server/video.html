<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Stream - Hermes GUI Agent</title>
<script src="https://cdn.jsdelivr.net/npm/mux.js@7.0.3/dist/mux.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:18px;color:#58a6ff}
.controls{padding:10px 20px;display:flex;gap:10px;align-items:center;flex-shrink:0;background:#161b22;border-bottom:1px solid #30363d}
.controls select,.controls button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer}
.controls button.primary{background:#238636;border-color:#238636;color:#fff}
.controls button.danger{background:#da3633;border-color:#da3633;color:#fff}
.controls button:disabled{opacity:0.4;cursor:not-allowed}
.status{font-size:12px;padding:4px 12px;border-radius:10px;background:#21262d}
.status.live{color:#3fb950}
.status.waiting{color:#f0883e}
.status.error{color:#f85149}
#videoContainer{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0;overflow:hidden}
#video{max-width:100%;max-height:100%}
#placeholder{color:#484f58;font-size:14px}
.info-bar{padding:8px 20px;font-size:11px;color:#484f58;background:#161b22;border-top:1px solid #30363d;flex-shrink:0;display:flex;gap:16px}
</style>
</head>
<body>
<div class="header">
  <h1>Video Stream</h1>
  <a href="." style="color:#8b949e;text-decoration:none;font-size:13px">Dashboard</a>
</div>
<div class="controls">
  <select id="deviceSelect"><option value="">-- Select Device --</option></select>
  <button id="startBtn" class="primary" onclick="startStream()" disabled>Start Stream</button>
  <button id="stopBtn" class="danger" onclick="stopStream()" disabled>Stop</button>
  <span id="status" class="status waiting">Not Connected</span>
</div>
<div id="videoContainer">
  <video id="video" muted autoplay playsinline style="display:none"></video>
  <div id="placeholder">Select a device and click Start Stream</div>
</div>
<div class="info-bar">
  <span id="fps">FPS: --</span>
  <span id="frames">Chunks: 0</span>
</div>

<script>
var DK = "";
var API_KEY = new URLSearchParams(window.location.search).get("api_key") || DK;
var API = window.location.pathname.replace(/\/video$/, "").replace(/\/$/, "") + "/api";

var streamActive = false;
var currentDevice = "";
var chunkCount = 0;
var fpsTimer = 0;
var eventSource = null;

// MSE setup
var mediaSource = null;
var sourceBuffer = null;
var transmuxer = null;
var videoEl = document.getElementById("video");
var pendingChunks = [];
var sbReady = false;

function log(msg) { console.log("[VIDEO] " + msg); }

function initMSE() {
  if (mediaSource) return;
  mediaSource = new MediaSource();
  videoEl.src = URL.createObjectURL(mediaSource);

  mediaSource.addEventListener("sourceopen", function() {
    log("MediaSource opened");
    try {
      sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4D401E"');
      sourceBuffer.mode = "sequence";
      sourceBuffer.addEventListener("updateend", function() {
        sbReady = true;
        flushPending();
      });
      sourceBuffer.addEventListener("error", function(e) { log("SB error: " + e); });
      sbReady = true;
    } catch(e) {
      log("addSourceBuffer failed: " + e);
      updateStatus("Codec not supported", "error");
    }
  });

  mediaSource.addEventListener("sourceended", function() { log("MediaSource ended"); });
  mediaSource.addEventListener("error", function() { log("MediaSource error"); });
}

function flushPending() {
  while (sbReady && pendingChunks.length > 0) {
    var chunk = pendingChunks.shift();
    try {
      if (!sourceBuffer.updating) {
        sourceBuffer.appendBuffer(chunk);
        sbReady = false;
      } else {
        pendingChunks.unshift(chunk);
        break;
      }
    } catch(e) {
      log("appendBuffer error: " + e);
    }
  }
}

async function loadDevices() {
  try {
    var r = await fetch(API + "/devices?api_key=" + API_KEY, {headers: {"X-Api-Key": API_KEY}});
    var data = await r.json();
    var sel = document.getElementById("deviceSelect");
    var cur = sel.value;
    sel.innerHTML = "<option value=\"\">-- Select Device --</option>";
    if (data.devices) {
      Object.entries(data.devices).forEach(function(e) {
        var id = e[0], info = e[1];
        sel.innerHTML += "<option value=\""+id+"\""+(id===cur?" selected":"")+">"+(info.name||id)+"</option>";
      });
    }
    sel.onchange = function() {
      currentDevice = sel.value;
      document.getElementById("startBtn").disabled = !currentDevice || streamActive;
      if (streamActive) stopStream();
    };
    if (!cur && currentDevice) sel.value = currentDevice;
  } catch(e) { log("devices: "+e); }
}

function updateStatus(text, cls) {
  var el = document.getElementById("status");
  el.textContent = text;
  el.className = "status " + cls;
}

async function startStream() {
  if (!currentDevice) return;
  updateStatus("Starting...", "waiting");
  document.getElementById("startBtn").disabled = true;

  // Stop any existing stream
  try {
    await fetch(API + "/stream-stop?device_id=" + currentDevice + "&api_key=" + API_KEY,
      {headers: {"X-Api-Key": API_KEY}});
    await new Promise(r => setTimeout(r, 500));
  } catch(e) {}

  // Trigger stream start on agent
  try {
    var r = await fetch(API + "/stream-start?device_id=" + currentDevice + "&fps=20&bitrate=2M&api_key=" + API_KEY,
      {headers: {"X-Api-Key": API_KEY}});
    var data = await r.json();
    log("start: " + JSON.stringify(data));
    if (data.error && data.status !== "already_running") {
      updateStatus("Error: " + data.error, "error");
      document.getElementById("startBtn").disabled = false;
      return;
    }
  } catch(e) {
    updateStatus("Start failed: " + e, "error");
    document.getElementById("startBtn").disabled = false;
    return;
  }

  // Init MSE + transmuxer
  initMSE();
  if (typeof muxjs !== "undefined") {
    transmuxer = new muxjs.mp4.Transmuxer();
    transmuxer.on("data", function(segment) {
      var data = new Uint8Array(segment.initSegment.byteLength + segment.data.byteLength);
      data.set(new Uint8Array(segment.initSegment), 0);
      data.set(new Uint8Array(segment.data), segment.initSegment.byteLength);
      pendingChunks.push(data.buffer);
      flushPending();
      chunkCount++;
    });
  }

  // Connect SSE for TS data
  var sseUrl = window.location.protocol + "//" + window.location.host + "/stream-sse?device_id=" + currentDevice;
  log("SSE: " + sseUrl);
  eventSource = new EventSource(sseUrl);
  eventSource.onmessage = function(e) {
    if (!streamActive) return;
    try {
      var b64 = e.data;
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      if (transmuxer) {
        transmuxer.push(bytes);
        transmuxer.flush();
      }
    } catch(err) { log("chunk error: " + err); }
  };
  eventSource.onerror = function() { log("SSE error"); };

  streamActive = true;
  chunkCount = 0;
  fpsTimer = performance.now();
  videoEl.style.display = "block";
  document.getElementById("placeholder").style.display = "none";
  updateStatus("Live", "live");
  document.getElementById("stopBtn").disabled = false;
  document.getElementById("startBtn").disabled = true;

  // FPS display
  (function fpsLoop() {
    if (!streamActive) return;
    setTimeout(fpsLoop, 1000);
    var elapsed = (performance.now() - fpsTimer) / 1000;
    var fps = elapsed > 0 ? (chunkCount / elapsed).toFixed(1) : 0;
    document.getElementById("fps").textContent = "FPS: " + fps;
    document.getElementById("frames").textContent = "Chunks: " + chunkCount;
  })();
}

async function stopStream() {
  streamActive = false;
  if (eventSource) { eventSource.close(); eventSource = null; }
  if (transmuxer) { transmuxer.dispose(); transmuxer = null; }
  if (mediaSource && mediaSource.readyState === "open") {
    try { mediaSource.endOfStream(); } catch(e) {}
  }
  mediaSource = null;
  sourceBuffer = null;
  sbReady = false;
  pendingChunks = [];
  videoEl.style.display = "none";
  document.getElementById("placeholder").style.display = "block";

  try {
    await fetch(API + "/stream-stop?device_id=" + currentDevice + "&api_key=" + API_KEY,
      {headers: {"X-Api-Key": API_KEY}});
  } catch(e) {}

  updateStatus("Stopped", "waiting");
  document.getElementById("startBtn").disabled = !currentDevice;
  document.getElementById("stopBtn").disabled = true;
  document.getElementById("fps").textContent = "FPS: --";
  document.getElementById("frames").textContent = "Chunks: 0";
}

loadDevices();
setInterval(loadDevices, 30000);
</script>
</body>
</html>
